name: Auto Update Playlists

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis tiap 1 jam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scrapers
        run: |
          python rx_soccer.py
          python fw.py
          python livetv_soccer.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add roxi_soccer.m3u livetv_soccer.m3u *.m3u
          git diff-index --quiet HEAD || git commit -m "Auto update M3U playlists"
          git push
