name: update.yml

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap 1 jam sekali
  workflow_dispatch: # Agar bisa dijalankan manual kapan saja via tombol

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Run FawaNews Scraper
        run: python fw.py

      - name: Run RoxieStreams Soccer Scraper
        run: python rx_soccer.py

      - name: Run NguyenBong Scraper
        run: python nguyenbong.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update all playlists" && git push)
