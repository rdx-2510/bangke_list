name: Auto Update All Playlists

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap 1 jam sekali
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pycryptodome

      - name: Run FawaNews Scraper
        run: python fw.py

      - name: Run RoxieStreams Soccer Scraper
        run: python rx_soccer.py

      - name: Run Movie Scraper
        run: python scrape_all_movies.py || true

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports and movies playlists [skip ci]" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)
