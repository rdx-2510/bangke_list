name: Trigger All BangkeTV Scrapers

on:
  workflow_dispatch:
    inputs:
      semua_sekarang:
        description: "Paksa jalankan SEMUA repo sekarang juga? (Pilih false jika dipicu cron-job.org)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  dispatch-smart:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluasi Jadwal WIB & Jalankan Target yang Sesuai
        env:
          PAT: ${{ secrets.PAT_TRIGGER }}
          FORCE: ${{ github.event.inputs.semua_sekarang }}
        run: |
          JAM=$(TZ="Asia/Jakarta" date +%H)
          MENIT=$(TZ="Asia/Jakarta" date +%M)
          WAKTU="${JAM}:${MENIT}"
          echo "⏰ Waktu Eksekusi WIB: $WAKTU | Force All: $FORCE"

          # Fungsi helper pemicu workflow
          trigger_wf() {
            local LABEL="$1"
            local REPO="$2"
            local WF="$3"
            local BRANCH="$4"
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAT" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF/dispatches" \
              -d "{\"ref\":\"$BRANCH\"}")
            echo "🚀 [$LABEL] -> HTTP $CODE"
          }

          # 1. FAWA & ROXIE (Jadwal asli: Tiap 1 jam sekali -> jalan di menit 00..14 setiap jam)
          if [[ "$FORCE" == "true" ]] || [[ $((10#$MENIT)) -lt 15 ]]; then
            trigger_wf "Fawa & Roxie (update.yml)" "rdx-2510/bangke_list" "update.yml" "main"
          else
            echo "⏭️ [Fawa & Roxie] Dilewati (bukan jadwal jam penuh :00)"
          fi

          # 2. FORK DOMS9/IPTV (Jadwal asli: Tiap 2 jam sekali -> jalan di jam genap menit :00)
          if [[ "$FORCE" == "true" ]] || ([[ $((10#$JAM % 2)) -eq 0 ]] && [[ $((10#$MENIT)) -lt 15 ]]); then
            trigger_wf "Fork doms9/iptv (scrape_json.yml)" "rdx-2510/iptv" "scrape_json.yml" "default"
          else
            echo "⏭️ [Fork doms9/iptv] Dilewati (bukan jadwal 2 jam sekali)"
          fi

          # 3. FORK FOOTBALL-IPTV (Jadwal asli: Jelang kick-off 15:00, 18:00, 19:30, 22:30, 23:30, 01:30 WIB)
          # Pastikan nama repo 'rdx-2510/football-iptv' sesuai dengan nama repo di akunmu
          if [[ "$FORCE" == "true" ]] || \
             ([[ "$JAM" =~ ^(15|18)$ ]] && [[ $((10#$MENIT)) -lt 15 ]]) || \
             ([[ "$JAM" =~ ^(19|22|23|01)$ ]] && [[ $((10#$MENIT)) -ge 25 ]] && [[ $((10#$MENIT)) -le 45 ]]); then
            trigger_wf "Fork football-iptv (update.yml)" "rdx-2510/football-iptv" "update.yml" "main"
          else
            echo "⏭️ [Fork football-iptv] Dilewati (bukan jam jelang kick-off)"
          fi

          # 4. MOVIES PUSATFILM21 (Jadwal asli: 1x sehari jam 07:00 WIB)
          if [[ "$FORCE" == "true" ]] || ([[ "$JAM" == "07" ]] && [[ $((10#$MENIT)) -lt 15 ]]); then
            trigger_wf "Movies (update_movies.yml)" "rdx-2510/bangke_list" "update_movies.yml" "main"
          else
            echo "⏭️ [Movies] Dilewati (hanya jalan jam 07:00 WIB)"
          fi
